<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    SetEnv STORE_DB_PATH /var/lib/forme/store.sqlite
    <Directory /var/www/html>
        Require all granted
        Options -Indexes
    </Directory>
    <Location /api/>
        SetHandler store-handler
        Require all granted
    </Location>
</VirtualHost>
